name: Qodo PR-Agent Reviewer

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  pull_request_target:
    types: [labeled, synchronize]
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: pr-agent-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  pr_agent:
    if: >-
      ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) ||
       (github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name != github.repository && contains(github.event.pull_request.labels.*.name, 'safe-to-test')) ||
       (github.event_name == 'issue_comment' && github.event.issue.pull_request && contains(github.event.comment.body, '/') && contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association))) &&
      github.event.sender.type != 'Bot'
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
      contents: read

    steps:
      - name: Check API key availability
        id: check_keys
        run: |
          if [ -z "${{ secrets.GEMINI_API_KEY }}" ]; then
            echo "Error: GEMINI_API_KEY is not configured in GitHub repository secrets. Failing closed."
            exit 1
          fi
          echo "has_key=true" >> "$GITHUB_OUTPUT"

      - name: Checkout Code
        if: steps.check_keys.outputs.has_key == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.base.ref || '' }}

      - name: Run PR-Agent Action
        if: steps.check_keys.outputs.has_key == 'true'
        uses: qodo-ai/pr-agent@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GOOGLE_AI_STUDIO.GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          config.model: "gemini/gemini-flash-lite-latest"
          config.fallback_models: '["gemini/gemini-flash-latest", "gemini/gemini-2.0-flash", "gemini/gemini-1.5-flash"]'
          config.custom_model_max_tokens: "32000"
          github_action_config.auto_review: "true"
          github_action_config.pr_actions: '["opened", "reopened", "ready_for_review", "review_requested", "synchronize", "labeled"]'
          github_action_config.auto_describe: "false"
          github_action_config.auto_improve: "false"
